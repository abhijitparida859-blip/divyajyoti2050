plugins {
    id 'com.android.application'
}
android {
    namespace 'in.kaliapanjika.pro'
    compileSdk 34
    defaultConfig {
        applicationId "in.kaliapanjika.pro"
        minSdk 24
        targetSdk 34
        versionCode 300
        versionName "3.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}